 try{
  const pages=await new Promise(res=>buildPDFPages(res));
  pdfChartImg(async img=>{
   const A=all(),tp=pdfPage(pdfHead(L('اتجاه المبيعات','Sales trend'))+'<img src="'+img+'" style="width:100%;border-radius:12px;margin-top:6px">');
   const extra=[tp];
   if(can('staff')){const R=STV(all().c).slice().sort((a,b)=>b.s-a.s);extra.push(pdfPage(pdfHead(L('أداء الموظفين','Staff performance'))+'<div class="ov"><table><tr><th>'+L('الموظف','Employee')+'<th>'+L('المبيعات','Sales')+'<th>'+L('التارجت','Target')+'<th>'+L('التحقيق','Achievement')+'<th>ATV<th>UPT</tr>'+R.map(e=>'<tr><td>'+esc(e.n)+'<td>'+Math.round(e.s).toLocaleString('en-US')+'<td>'+Math.round(e.t).toLocaleString('en-US')+'<td>'+Math.round(dv(e.s,e.t)*100)+'%<td>'+Math.round(dv(e.s,e.x))+'<td>'+dv(e.u,e.x).toFixed(2)+'</tr>').join('')+'</table></div>'))}
   if(can('vm')){const o={r:0,y:1,g:2};extra.push(pdfPage(pdfHead(L('مناطق العرض (VM)','Display zones (VM)'))+'<div class="ov"><table><tr><th>'+L('المنطقة','Zone')+'<th>'+L('الحالة','Status')+'<th>'+L('أيام التغطية','Cover days')+'<th>'+L('التوصية','Recommendation')+'</tr>'+D.zones.map(zrec).sort((a,b)=>o[a.cls]-o[b.cls]).map(z=>'<tr><td>'+X(z.n)+'<td>'+X(z.t)+'<td>'+Math.round(z.dc)+'<td style="white-space:normal;max-width:480px">'+X(z.m)+'</tr>').join('')+'</table></div>'))}
   if(can('goal')){const a=D.days,Ld=a[a.length-1],mo=Ld.d.slice(0,2),md=a.filter(x=>x.d.slice(0,2)===mo),dim=new Date(new Date().getFullYear(),+mo,0).getDate(),day=+Ld.d.slice(3),mtd=sum(md,'s'),Tm=D.P.mT,left=Math.max(0,dim-day),r7=a.slice(-7),a7=dv(sum(r7,'s'),r7.length),pj=mtd+a7*left;
    extra.push(pdfPage(pdfHead(L('الأهداف الشهرية','Monthly goals'))+'<div class="kg">'+[[L('تارجت الشهر','Month target'),fv(Tm,'n')],[L('محقق حتى الآن','Achieved so far'),fv(mtd,'n')],[L('المتوقع بنهاية الشهر','Projected month-end'),fv(pj,'n')],[L('المطلوب يوميًا','Required per day'),fv(left?Math.max(0,Tm-mtd)/left:0,'n')]].map(x=>'<div class="kc"><div class="sub">'+x[0]+'</div><div class="val" style="color:var(--ac)">'+x[1]+'</div></div>').join('')+'</div>'))}
   if(can('cmp')){extra.push(pdfPage(pdfHead(L('مقارنة الفروع','Branch comparison'))+'<div class="ov"><table><tr><th>'+L('الفرع','Branch')+'<th>'+L('التحقيق','Achievement')+'<th>'+L('التحويل','Conversion')+'<th>ATV<th>UPT<th>'+L('مبيعات/زائر','Sales/visitor')+'</tr>'+cmList().map(b=>'<tr><td>'+X(b.name)+'<td>'+fv(b.ach,'p')+'<td>'+fv(b.conv,'p')+'<td>'+fv(b.atv,'n')+'<td>'+fv(b.upt,'d')+'<td>'+fv(b.spv,'n')+'</tr>').join('')+'</table></div>'))}
   extra.push(pdfPage('<div style="min-height:600px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px"><h1 style="font-size:36px">'+L('شكرًا لكم','Thank you')+'</h1><div style="font-size:16px;color:#64748b">'+esc(co())+'</div></div>'));
   const all_pages=pages.concat(extra);
   host.innerHTML=all_pages.join('');tx(host);
   const {jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
   const nodes=host.querySelectorAll('.pg');
   for(let i=0;i<nodes.length;i++){const cvs=await html2canvas(nodes[i],{scale:2,backgroundColor:'#ffffff',useCORS:true});const im=cvs.toDataURL('image/jpeg',0.92),ar=cvs.height/cvs.width,w=297,hgt=w*ar;if(i)pdf.addPage();pdf.addImage(im,'JPEG',0,0,w,Math.min(210,hgt))}
   pdf.save('ALAA-ADEL-KPI-Report-'+new Date().toISOString().slice(0,10)+'.pdf');
   document.body.removeChild(host);toast(L('تم تصدير PDF','PDF exported'))
  })
 }catch(e){try{document.body.removeChild(host)}catch(_){}toast(L('تعذر تصدير PDF','PDF export failed'))}}

/* ---- Boot ---- */
document.addEventListener('click',e=>{if(!e.target.closest('.menu'))document.querySelectorAll('.dd.show').forEach(x=>x.classList.remove('show'))});
lp();applyTheme();
(function(){let done=0;const fin=()=>{if(done)return;done=1;let id=null;try{id=localStorage.getItem('dd_u')||sessionStorage.getItem('dd_u')}catch(e){}const u=id&&D.S.users.find(x=>x.id===id);if(u){U=u;enter()}else loginV()};cloudPull(fin);setTimeout(fin,5000)})();

const LAMP='<svg viewBox="0 0 240 400" aria-label="lamp"><defs><radialGradient id="nxg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fff3c4" stop-opacity=".75"/><stop offset="45%" stop-color="#f5d76e" stop-opacity=".25"/><stop offset="100%" stop-color="#d4af37" stop-opacity="0"/></radialGradient></defs><ellipse class="glow" cx="120" cy="120" rx="170" ry="150" fill="url(#nxg)"/><path class="shade" d="M28 160 C28 70 70 38 120 38 C170 38 212 70 212 160 Z" fill="#fff8e6"/><rect x="113" y="160" width="14" height="182" rx="4" fill="#e9e4d6"/><rect x="58" y="338" width="124" height="16" rx="8" fill="#e9e4d6"/><g class="cord"><line x1="186" y1="150" x2="186" y2="232" stroke="#6a5a33" stroke-width="2"/><circle cx="186" cy="244" r="11" fill="#d9a066"/><rect x="170" y="150" width="32" height="110" fill="transparent"/></g></svg>';
const en=()=>document.documentElement.lang==='en';
let lampOn=false;
try{if(!localStorage.getItem('dd_pref')){PR.mode='dark';applyTheme()}}catch(e){}
function enhLogin(){
 const l=document.getElementById('login');if(!l||l.hidden)return;
 const c=l.querySelector('.lcard');if(!c||c.dataset.nx)return;c.dataset.nx=1;
 l.insertAdjacentHTML('afterbegin','<div class="nx-lamp'+(lampOn?'':' off')+'">'+LAMP+'<div class="nx-hint">'+(en()?'Pull the chain':'اسحب السلسلة')+'</div></div>');
 l.classList.toggle('nx-on',lampOn);
 const lp=l.querySelector('.nx-lamp'),cord=lp.querySelector('.cord');
 const pull=()=>{cord.classList.add('pull');setTimeout(()=>cord.classList.remove('pull'),180);lampOn=!lampOn;lp.classList.toggle('off',!lampOn);l.classList.toggle('nx-on',lampOn);if(lampOn)setTimeout(()=>{const u=document.getElementById('lu');u&&u.focus()},450)};
 cord.setAttribute('tabindex','0');cord.setAttribute('role','button');
 cord.addEventListener('click',pull);cord.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pull()}});
 const h=c.querySelector('h2');
 if(h)h.insertAdjacentHTML('beforebegin','<img class="nx-flogo" src="'+FULL+'" alt="NEXUS SYSTEMS"><div class="nx-wel">'+(en()?'Welcome':'أهلاً بك')+'</div>');
}
function enhSide(){const s=document.getElementById('side');if(s&&!s.querySelector('.nx-sl'))s.insertAdjacentHTML('afterbegin','<div class="nx-sl"><img src="'+EMB+'" alt="NEXUS SYSTEMS"></div>')}
function enhTop(){const t=document.getElementById('top');if(t&&!t.querySelector('.nx-tl'))t.insertAdjacentHTML('afterbegin','<img class="nx-tl" src="'+EMB+'" alt="NEXUS SYSTEMS">')}
function enhFoot(){const f=document.querySelector('.sig');if(f&&!f.querySelector('.nx-fl'))f.insertAdjacentHTML('afterbegin','<img class="nx-fl" src="'+FULL+'" alt="NEXUS SYSTEMS">')}
function all(){enhLogin();enhSide();enhTop();enhFoot()}
['login','side','top'].forEach(id=>{const e=document.getElementById(id);if(e)new MutationObserver(all).observe(e,{childList:true})});
all();
})();
</script>
